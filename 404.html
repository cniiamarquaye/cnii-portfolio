<div class="min-h-[60vh] flex items-center justify-center px-6 py-10">
  <div class="max-w-xl text-center">
    <h1
      class="text-5xl sm:text-6xl font-semibold text-slate-800 dark:text-slate-100 mb-4"
    >
      404
    </h1>

    <h2
      class="text-xl sm:text-2xl font-semibold text-slate-700 dark:text-slate-200 mb-3"
    >
      We can’t seem to find the page you’re looking for.
    </h2>

    <p class="text-slate-600 dark:text-slate-400 mb-6">
      It might have been moved, deleted, or the URL was typed incorrectly.
    </p>

    <p class="text-sm text-slate-500 mb-8">
      If you entered the address manually, double-check the spelling.
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <a
        href="{{ '/' | relative_url }}"
        class="bg-slate-800 text-white px-6 py-3 rounded-lg hover:bg-slate-700 dark:bg-slate-200 dark:text-slate-900 dark:hover:bg-slate-300 transition"
      >
        Back to Home
      </a>
    
      <a id="report-link" href="mailto:cniiamarquaye@yahoo.com"
        class="border border-slate-400 text-slate-800 dark:text-slate-200 px-6 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        Report this broken link
      </a>
    </div>
  </div>
</div>
<script>
  (function () {
    var link = document.getElementById("report-link");
    if (!link) return;
    var body = "Hello,\n\nI found a broken page on your portfolio.\n\nPage: " + window.location.href + "\nI came from: " + (document.referrer || "unknown") + "\n";
    link.href = "mailto:cniiamarquaye@yahoo.com?subject=" + encodeURIComponent("Broken link on portfolio") + "&body=" + encodeURIComponent(body);
  })();
</script>
